server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  error:
    include-message: never
spring:
  application:
    name: abarrato-backend
  datasource:
    url: ${ABARRATO_DB_URL}
    username: ${ABARRATO_DB_USER}
    password: ${ABARRATO_DB_PASSWORD}
  flyway:
    user: ${ABARRATO_MIGRATION_USER:${ABARRATO_DB_USER}}
    password: ${ABARRATO_MIGRATION_PASSWORD:${ABARRATO_DB_PASSWORD}}
abarrato:
  comparacion:
    vigencia-web: ${ABARRATO_MAX_WEB_AGE:PT15M}
    vigencia-sucursal: ${ABARRATO_MAX_BRANCH_AGE:PT24H}
  recoleccion:
    habilitada: ${ABARRATO_SCRAPE_ENABLED:true}
    cron: ${ABARRATO_SCRAPE_CRON:0 0 */3 * * *}
    proxy-host: ${ABARRATO_PROXY_HOST:}
    proxy-puerto: ${ABARRATO_PROXY_PORT:0}
